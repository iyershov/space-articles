@let currentArticle = article();

<a class="article-link"
   [routerLink]="['/article', currentArticle.id]"
   [attr.aria-label]="'Read article: ' + currentArticle.title">
  <mat-card class="article-card">
    <div class="article-image-container">
      @if (imageAvailable()) {
        <img mat-card-image
             class="article-image"
             loading="lazy"
             [src]="currentArticle.image_url"
             [alt]="currentArticle.title"
             (error)="onImageError()" />
      } @else {
        <div class="article-image-placeholder" aria-hidden="true">
          <mat-icon>image_not_supported</mat-icon>
          <span>No image available</span>
        </div>
      }
    </div>

    <mat-card-content>
      <time [attr.datetime]="currentArticle.published_at">
        <mat-icon class="calendar-icon" aria-hidden="true">calendar_today</mat-icon>
        {{ currentArticle.published_at | ordinalDate }}
      </time>

      <h2 class="article-title" [innerHTML]="currentArticle.title | highlight:searchTerm()"></h2>
      <p class="article-summary" [innerHTML]="currentArticle.summary | truncate:100 | highlight:searchTerm()"></p>
    </mat-card-content>

    <mat-card-actions>
      <span class="read-more">
        Read more
        <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      </span>
    </mat-card-actions>
  </mat-card>
</a>
